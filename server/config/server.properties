# SteveFish local server. Copied to server/run/ on first start; edit there afterwards.
# Loopback only: nothing here is reachable from another machine (project rule: solo/local-only).
server-ip=127.0.0.1
server-port=25565
# The bot logs in offline as Steve. Safe only because the server is bound to 127.0.0.1 (decisions D14).
online-mode=false
enforce-secure-profile=false
prevent-proxy-connections=false
enable-rcon=true
rcon.port=25575
rcon.password=__GENERATED__
broadcast-rcon-to-ops=false
enable-query=false
motd=SteveFish local
max-players=4
white-list=false
# Void world: everything in it is something we (or Steve) built.
level-name=world
level-type=minecraft\:flat
generator-settings={"layers"\:[{"block"\:"minecraft\:air","height"\:1}],"biome"\:"minecraft\:plains"}
generate-structures=false
spawn-protection=0
allow-flight=true
difficulty=peaceful
gamemode=survival
pvp=false
view-distance=6
simulation-distance=4
enable-command-block=false
sync-chunk-writes=true
